# Project-wide Gradle settings for FixNow Android (Capacitor 8).

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Memory + encoding for AGP 8.13 / Gradle 8.14
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Prefer Android Studio JBR 21 when the shell JAVA_HOME is still on 17.
# Required when system JAVA_HOME defaults to JDK 17 (Capacitor 8 needs 21).
# Other machines: update the path, comment out, or use `npm run android:assemble`
# which auto-detects Android Studio JBR / FIXNOW_JAVA_HOME.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

<script>
        function toggleService(el) {
            // Check if already selected to deselect
            if (el.classList.contains('selected')) {
                el.classList.remove('selected', 'border-primary', 'bg-primary/5');
            } else {
                // For this UI, allow single selection (toggle logic)
                document.querySelectorAll('button.selected').forEach(btn => {
                    btn.classList.remove('selected', 'border-primary', 'bg-primary/5');
                });
                el.classList.add('selected', 'border-primary', 'bg-primary/5');
            }
        }

        function selectTime(el) {
            document.querySelectorAll('.active-slot').forEach(slot => {
                slot.classList.remove('active-slot');
            });
            el.classList.add('active-slot');
        }

        // Apply initial selection
        document.querySelectorAll('button')[1].classList.add('selected', 'border-primary', 'bg-primary/5');
    </script>

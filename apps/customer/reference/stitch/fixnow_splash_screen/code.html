<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-bar {
            position: relative;
            overflow: hidden;
        }
        .shimmer-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 1.5s infinite;
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-bright flex flex-col items-center justify-center min-h-screen selection:bg-primary-fixed-dim">
<!-- Splash Screen Container -->
<main class="relative flex flex-col items-center justify-between w-full h-screen max-w-lg px-gutter-mobile py-24">
<!-- Empty Top Spacer -->
<div></div>
<!-- Center Identity -->
<div class="flex flex-col items-center text-center fade-in-up" style="animation-delay: 0.1s;">
<!-- Logo Icon Representation -->
<div class="w-20 h-20 mb-6 bg-primary rounded-xl flex items-center justify-center shadow-lg transform rotate-3 hover:rotate-0 transition-transform duration-500">
<span class="material-symbols-outlined text-on-primary text-[40px]" data-icon="build" style="font-variation-settings: 'FILL' 1;">build</span>
</div>
<!-- Brand Name from JSON -->
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-2">
                FixNow
            </h1>
<!-- Tagline -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px]">
                Trusted Technicians Near You
            </p>
</div>
<!-- Bottom Loading Section -->
<div class="w-full flex flex-col items-center gap-6 fade-in-up" style="animation-delay: 0.4s;">
<!-- Progress Bar -->
<div class="w-48 h-[2px] bg-outline-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-0 transition-all duration-[3000ms] ease-in-out" id="progress-indicator"></div>
</div>
<!-- Status Label -->
<span class="font-label-caps text-label-caps text-outline uppercase tracking-widest">
                Connecting to Network
            </span>
</div>
</main>
<!-- Background Atmospheric Element (Subtle Gradient) -->
<div class="fixed inset-0 -z-10 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary opacity-[0.03] blur-[100px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-trust-blue opacity-[0.05] blur-[100px] rounded-full"></div>
</div>
<script>
        // Progress bar simulation
        window.addEventListener('DOMContentLoaded', () => {
            const bar = document.getElementById('progress-indicator');
            setTimeout(() => {
                bar.style.width = '100%';
            }, 100);

            // Optional: Redirect simulation or interaction after loading
            /*
            setTimeout(() => {
                console.log('App ready');
                // document.body.classList.add('fade-out');
            }, 3500);
            */
        });

        // Add a subtle parallax effect to the logo on mouse move
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('.w-20.h-20');
            if (logo) {
                const x = (window.innerWidth / 2 - e.pageX) / 50;
                const y = (window.innerHeight / 2 - e.pageY) / 50;
                logo.style.transform = `rotate(3deg) translate(${x}px, ${y}px)`;
            }
        });
    </script>
</body></html>

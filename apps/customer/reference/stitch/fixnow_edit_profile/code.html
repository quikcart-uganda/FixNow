<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Edit Profile - FixNow</title>

<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
        }
        .profile-avatar-shadow {
            box-shadow: 0px 4px 20px rgba(0,0,0,0.08);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3d27bc;
            box-shadow: 0 0 0 1px #3d27bc;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface selection:bg-primary/10">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-canvas-white shadow-sm border-b border-border-subtle h-14 flex items-center justify-between px-gutter-mobile">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface">Edit Profile</h1>
</div>
<button class="px-4 py-1.5 rounded-xl text-primary font-semibold hover:bg-primary-fixed transition-colors active:scale-95">
            Save
        </button>
</header>
<main class="pt-24 pb-32 max-w-2xl mx-auto px-gutter-mobile">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center mb-section-gap">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden profile-avatar-shadow border-4 border-canvas-white bg-surface-container">
<img alt="Suna Ivan" class="w-full h-full object-cover" data-alt="A professional close-up portrait of Suna Ivan, a confident young Ugandan man with a friendly smile. He is set against a clean, soft-lit studio background that emphasizes a high-end, corporate aesthetic. The lighting is warm and balanced, highlighting his features with crisp clarity, maintaining the minimalist and professional atmosphere of the FixNow platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFB0y6ylhgdMYnUGz9BWn-bNIEOjFPYUZXzLSEsQqVcwwOqSjmf0mJpVMlqYuu0KlNKm2_1pAr5tmS4Abz42WuWTAzA8JBN53JihmIYSLldx-_CMY-Mt-TmdrP828R0m-PeY_ZhXhR3_LiCI3oUGP2iYJVqOpNXZoPdpcd3CPm6CqA4_IM2j-TprGwGHUbOt0tHkddGqhgbt7int9jxq9-VQSSKzVmyHh4-R9X1u6rbUNTm59zOsz4H7_fLAaacqMmlmgqosY5kOM"/>
</div>
<button class="absolute bottom-0 right-0 w-10 h-10 bg-primary text-on-primary rounded-full flex items-center justify-center border-2 border-canvas-white shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
</button>
</div>
<div class="mt-4 flex items-center gap-1.5">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Profile Identity</span>
</div>
</section>
<!-- Form Fields -->
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="full-name">Full Name</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-canvas-white border border-border-subtle rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all" id="full-name" type="text" value="Suna Ivan"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-canvas-white border border-border-subtle rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all" id="email" type="email" value="suna.ivan@example.ug"/>
</div>
</div>
<!-- Phone Number -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="phone">Phone Number</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-canvas-white border border-border-subtle rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all" id="phone" type="tel" value="+256 700 000 000"/>
</div>
</div>
<!-- Bio -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block" for="bio">Professional Bio</label>
<div class="relative">
<textarea class="w-full p-4 bg-canvas-white border border-border-subtle rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-outline transition-all resize-none" id="bio" rows="4">Certified electrical technician with over 5 years of experience in domestic and industrial installations across Kampala. Committed to safety and precision.</textarea>
</div>
</div>
<!-- Secondary Section -->
<div class="pt-4 space-y-4">
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border border-border-subtle">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-success-green" style="font-variation-settings: 'FILL' 1;">verified</span>
<div>
<p class="font-body-sm text-body-sm font-semibold text-on-surface">Verified Identity</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Your account is fully secured</p>
</div>
</div>
<span class="px-2 py-1 bg-success-green/10 text-success-green font-label-caps text-[10px] rounded-md uppercase">Active</span>
</div>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-high transition-colors rounded-xl group" type="button">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant">lock_reset</span>
<span class="font-body-lg text-body-lg font-medium text-on-surface">Change Password</span>
</div>
<span class="material-symbols-outlined text-outline group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
</form>
</main>
<!-- Fixed Bottom Save Button -->
<div class="fixed bottom-0 left-0 w-full bg-canvas-white p-gutter-mobile border-t border-border-subtle md:hidden z-50">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-md text-title-md shadow-lg active:scale-[0.98] transition-all hover:bg-primary-container">
            Save Changes
        </button>
</div>
<!-- Desktop Save Button (Centered Max-Width) -->
<div class="hidden md:block fixed bottom-8 left-1/2 -translate-x-1/2 w-full max-w-2xl px-gutter-mobile z-50">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-md text-title-md shadow-xl active:scale-[0.98] transition-all hover:bg-primary-container">
            Save Changes
        </button>
</div>
<script>
        // Simple micro-interaction for camera icon
        const cameraBtn = document.querySelector('button .material-symbols-outlined');
        if (cameraBtn) {
            cameraBtn.parentElement.addEventListener('mousedown', () => {
                cameraBtn.style.transform = 'scale(0.9)';
            });
            cameraBtn.parentElement.addEventListener('mouseup', () => {
                cameraBtn.style.transform = 'scale(1)';
            });
        }

        // Form field focus effects handled by Tailwind focus: classes
    </script>
</body></html>

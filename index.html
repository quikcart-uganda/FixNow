    <!--
      Branded boot splash. Rendered as static markup with an INLINE logo so the
      FixNow mark is visible on the very first painted frame — no blank white,
      no flat blue, no JS-injection gap, no image round-trip. React fades this
      out (via #fixnow-boot-splash) once initialization completes.
    -->
    <style>
      html {
        background: #002a74;
      }
      html.fixnow-splash-boot,
      body.fixnow-splash-boot {
        overflow: hidden !important;
      }
      body.fixnow-splash-boot #root {
        visibility: hidden !important;
        pointer-events: none !important;
      }
      #fixnow-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-items: center;
        margin: 0;
        padding: max(env(safe-area-inset-top), 0px) 24px max(env(safe-area-inset-bottom), 0px);
        color: #f7f9fb;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(circle at 18% 16%, rgba(178, 213, 255, 0.28), transparent 34%),
          radial-gradient(circle at 82% 22%, rgba(255, 204, 0, 0.12), transparent 28%),
          radial-gradient(circle at 48% 92%, rgba(37, 99, 235, 0.35), transparent 40%),
          linear-gradient(145deg, #002a74 0%, #004ac6 44%, #2563eb 82%);
        opacity: 1;
        transition: opacity 420ms ease;
      }
      #fixnow-boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #fixnow-boot-splash .boot-inner {
        display: grid;
        justify-items: center;
        gap: 18px;
        text-align: center;
        animation: fnBootEnter 640ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #fixnow-boot-splash .boot-mark {
        width: 92px;
        height: 92px;
        border-radius: 26px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: #004ac6;
        box-shadow: 0 28px 60px rgba(0, 26, 92, 0.32);
        display: grid;
        place-items: center;
        animation: fnBootLogo 2.6s ease-in-out infinite;
      }
      #fixnow-boot-splash .boot-mark svg {
        width: 52px;
        height: 52px;
        display: block;
      }
      #fixnow-boot-splash .boot-word {
        font-size: clamp(42px, 11vw, 60px);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #fixnow-boot-splash .boot-word .fn-now {
        color: #ffcc00;
      }
      #fixnow-boot-splash .boot-tag {
        margin: 0;
        font-size: clamp(14px, 3.6vw, 16px);
        font-weight: 600;
        opacity: 0.86;
      }
      #fixnow-boot-splash .boot-loader {
        margin-top: 6px;
        width: min(200px, 52vw);
        height: 5px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.2);
      }
      #fixnow-boot-splash .boot-loader > span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ffffff, #b2d5ff, #ffcc00);
        animation: fnBootLoad 1.15s ease-in-out infinite;
      }
      @keyframes fnBootEnter {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes fnBootLogo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes fnBootLoad {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #fixnow-boot-splash .boot-inner,
        #fixnow-boot-splash .boot-mark,
        #fixnow-boot-splash .boot-loader > span {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body class="fixnow-splash-boot">
    <div id="fixnow-boot-splash" role="status" aria-label="FixNow is starting">
      <div class="boot-inner">
        <div class="boot-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path
              fill="#ffffff"
              d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"
            />
          </svg>
        </div>
        <div class="boot-word" aria-label="FixNow"><span class="fn-fix">Fix</span><span class="fn-now">Now</span></div>
        <p class="boot-tag">Reliable professionals at your fingertips.</p>
        <div class="boot-loader" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var html = document.documentElement;
        html.classList.add('fixnow-splash-boot');
        var done = false;
        try {
          done = sessionStorage.getItem('fixnow_cold_splash_done_v1') === '1';
        } catch (e) {}
        if (done) {
          // Warm start: skip the branded moment entirely, reveal the app instantly.
          html.classList.remove('fixnow-splash-boot');
          document.body && document.body.classList.remove('fixnow-splash-boot');
          var warm = document.getElementById('fixnow-boot-splash');
          if (warm) warm.remove();
          return;
        }
        // Fail-safe: never let the boot splash trap the user if React fails to mount.
        window.setTimeout(function () {
          html.classList.remove('fixnow-splash-boot');
          document.body && document.body.classList.remove('fixnow-splash-boot');
          var splash = document.getElementById('fixnow-boot-splash');
          if (splash) {
            splash.classList.add('is-leaving');
            window.setTimeout(function () {
              splash && splash.remove();
            }, 460);
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
